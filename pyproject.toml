[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-contained-provider-aws-secrets"
version = "0.2.0"
description = "Dispenses AWS credentials to authorized consumers via the trust-server protocol."
requires-python = ">=3.12"
dependencies = [
    "ai-contained-core-mcp>=0.4.0",
    "ai-contained-provider-trust-server-daemon>=1.1.0",
    "json5>=0.14.0",
]

# Fallback sources — only consulted when nothing else already satisfies the name in
# the current resolve (e.g. a sibling /opt/ directory in a monolithic image build).
# Move these to tags once the branches are released; TODO tracks that.
[tool.uv.sources]
ai-contained-core-mcp = { git = "https://github.com/AI-Contained/ai-contained-base", subdirectory = "packages/core-mcp", branch = "kill-singletons" }
ai-contained-provider-trust-server-daemon = { git = "https://github.com/AI-Contained/ai-contained-provider-trust-server", subdirectory = "packages/daemon", branch = "kill-singletons" }
# Transitive — pulled in via ai-contained-provider-trust-client[dev]. uv.sources is
# not inherited from a dependency's own pyproject.toml, so it must be repeated here.
ai-contained-provider-trust-server-client = { git = "https://github.com/AI-Contained/ai-contained-provider-trust-server", subdirectory = "packages/client", branch = "kill-singletons" }

[project.optional-dependencies]
dev = [
    "ai-contained-provider-trust-client @ https://github.com/AI-Contained/ai-contained-provider-trust-client/archive/refs/heads/kill-singletons.zip",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-describe>=3.1",
    "assertpy>=1.1",
    "mypy>=1.20.2",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "focus: run only focused tests (use with -m focus)",
]

[project.entry-points."ai_contained.provider"]
aws_secrets = "ai_contained.provider.aws_secrets:provide"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D203", "D213"]  # conflict with D211/D212

[tool.ruff.lint.isort]
known-first-party = ["ai_contained"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # no docstrings required in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
strict = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ai_contained"]
